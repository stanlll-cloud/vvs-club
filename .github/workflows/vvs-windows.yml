name: vvs-club Windows
on:
  workflow_dispatch:
    inputs:
      backend_only:
        description: Only validate the frozen backend
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  ffmpeg:
    if: ${{ !inputs.backend_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6.1.0
        id: cache
        with:
          key: vvs-ffmpeg-v1-${{ hashFiles('scripts/build_ffmpeg_windows.sh', 'scripts/dav1d-mingw64.ini', 'scripts/fetch_ffmpeg_sources.py', 'scripts/ffmpeg-sources.json') }}
          path: |
            build/ffmpeg-windows/ffmpeg
            build/ffmpeg-windows/ffmpeg-corresponding-source.zip
      - name: Prepare cross compiler
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix mingw-w64-x86-64-dev nasm pkg-config python3 clang meson ninja-build cmake ca-certificates curl xz-utils
      - name: Build pinned FFmpeg sources
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/build_ffmpeg_windows.sh build/ffmpeg-windows
      - uses: actions/upload-artifact@v7
        with:
          name: vvs-ffmpeg-windows
          path: |
            build/ffmpeg-windows/ffmpeg/
            build/ffmpeg-windows/ffmpeg-corresponding-source.zip
          if-no-files-found: error
          retention-days: 14
  backend:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - name: Prepare locked Python dependencies
        run: uv sync --locked --extra build
      - name: Prepare Windows backend and assets
        run: .venv/Scripts/python.exe desktop/windows/prepare.py
      - name: Smoke test the bundled backend
        shell: pwsh
        run: |
          & .venv/Scripts/python.exe desktop/windows/smoke.py --backend build/vvs-windows-backend/vvs-service/vvs-service.exe --openlist build/vvs-windows-dependencies/openlist.exe
          if ($LASTEXITCODE -ne 0) { throw 'Bundled backend smoke test failed' }
      - uses: actions/upload-artifact@v7
        with:
          name: vvs-windows-backend
          path: |
            build/vvs-windows-backend/vvs-service/
            build/vvs-windows-dependencies/openlist.exe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: vvs-windows-assets
          path: desktop/windows/assets/
          if-no-files-found: error
          retention-days: 14
  build:
    needs: [ffmpeg, backend]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/windows/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: vvs-ffmpeg-windows
          path: build/ffmpeg-windows
      - uses: actions/download-artifact@v8
        with:
          name: vvs-windows-backend
          path: build
      - uses: actions/download-artifact@v8
        with:
          name: vvs-windows-assets
          path: desktop/windows/assets
      - name: Install locked desktop dependencies
        working-directory: desktop/windows
        run: npm ci
      - name: Build installer and archive
        working-directory: desktop/windows
        run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke test packaged Windows interface
        shell: pwsh
        run: |
          $env:VVS_SMOKE_REPORT = Join-Path $env:RUNNER_TEMP 'vvs-ui-smoke.json'
          $App = Resolve-Path 'build/vvs-club-windows/win-unpacked/vvs-club.exe'
          $Process = Start-Process -FilePath $App -ArgumentList '--vvs-smoke' -Wait -PassThru
          if ($Process.ExitCode -ne 0) { throw 'Packaged UI check failed' }
          $Report = Get-Content $env:VVS_SMOKE_REPORT -Raw | ConvertFrom-Json
          if (-not $Report.ok) { throw 'Packaged UI did not report success' }
          Write-Output ($Report | ConvertTo-Json -Compress)
      - uses: actions/upload-artifact@v7
        with:
          name: vvs-club-windows-x64
          path: |
            build/vvs-club-windows/*.exe
            build/vvs-club-windows/*.zip
          if-no-files-found: error
          retention-days: 14
