<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>vvs-club · 网盘连接</title><style>
:root{color-scheme:light;--bg:#f5f5f7;--text:#1d1d1f;--muted:#66666c;--glass:#ffffff90;--edge:#ffffffd9;--line:#00000014;--button:#1d1d1f;--on:#fff}html.dark{color-scheme:dark;--bg:#101010;--text:#f5f5f7;--muted:#b0b0b6;--glass:#ffffff0c;--edge:#ffffff30;--line:#ffffff20;--button:#f5f5f7;--on:#1d1d1f}*{box-sizing:border-box}body{margin:0;padding:32px;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:var(--bg);color:var(--text)}button{font:inherit;cursor:pointer;min-height:44px;padding:10px 18px;border:1px solid var(--edge);border-radius:12px;color:var(--text);background:var(--glass)}button:disabled{opacity:.48;cursor:default}button:hover:not(:disabled){filter:brightness(.95)}button:focus-visible{outline:3px solid #007aff;outline-offset:2px}.primary{background:var(--button);color:var(--on);border-color:transparent}h1{font-size:30px;letter-spacing:-.8px;margin:4px 0 10px}h2{font-size:19px;margin:0}p{line-height:1.7;color:var(--muted)}.glass{border:1px solid var(--edge);border-radius:20px;background:linear-gradient(135deg,#ffffff12,transparent 60%),var(--glass);box-shadow:inset 0 1px #ffffff30,0 12px 32px #0000000c;backdrop-filter:blur(24px)}.providers{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0}.providers button{flex:1;min-width:110px;text-align:left}.providers button.selected{box-shadow:inset 0 0 0 1px var(--text);background:var(--glass)}.providers small{display:block;font-size:12px;color:var(--muted);margin-top:5px}.panel{padding:25px}.head,.actions,.row{display:flex;align-items:center;gap:12px}.head{justify-content:space-between}.actions{flex-wrap:wrap;margin-top:20px}.steps{display:flex;gap:22px;font-size:13px;color:var(--muted);margin:18px 0 0}.notice{border-left:3px solid #888;padding:8px 12px;white-space:pre-wrap}.hidden{display:none!important}.breadcrumb{margin:20px 0;overflow-wrap:anywhere;font-size:13px;color:var(--muted)}.files{margin-top:15px;border-top:1px solid var(--line)}.row{padding:12px 0;border-bottom:1px solid var(--line)}.row span{flex:1;overflow-wrap:anywhere}.row small{color:var(--muted)}.footer{border-top:1px solid var(--line);padding-top:22px;margin-top:30px}.footer p{font-size:13px}#error{color:var(--text)}video{width:100%;max-height:400px;background:#000;border-radius:15px;margin-top:15px}#progress{font-variant-numeric:tabular-nums}button.link{text-decoration:underline;border:0;background:none;padding:0 4px}#status{font-size:13px;color:var(--muted)}@media(max-width:600px){body{padding:20px;font-size:16px}.head{align-items:start;flex-direction:column}.panel{padding:18px}.steps{flex-wrap:wrap;gap:10px}}@media(prefers-reduced-transparency:reduce){.glass{backdrop-filter:none;background:var(--bg)}}
</style></head><body><h1>连接你的网盘</h1><p>登录自己的网盘，选择云端目录，再扫描里面的影片。</p><div class="steps"><span>① 登录授权</span><span>② 选择盘内目录</span><span>③ 扫描影片</span></div><div id="providers" class="providers"></div><div id="error" class="notice hidden" role="alert"></div><section class="glass panel"><div class="head"><h2 id="name">正在准备网盘连接…</h2><span id="status">只在这台电脑运行</span></div><div id="login"><p id="description"></p><p id="privacy">登录页面由网盘提供，授权连接由 OpenList 处理。部分授权令牌会经过 api.oplist.org；扫描与播放使用这台电脑当前的网络。</p><div class="actions"><button class="primary" id="authorize">登录并授权</button><button id="clear" class="hidden">清除旧连接后重新登录</button></div></div><div id="browser" class="hidden"><div class="actions"><button id="up">上一级</button><button id="rescan" class="primary">扫描这个目录</button><button id="refresh">刷新目录</button><button id="disconnect">断开连接</button></div><p id="breadcrumb" class="breadcrumb"></p><div id="files" class="files"></div></div><p id="progress" role="status"></p><div id="results" class="hidden"><div class="head"><h2 id="result-title">扫描结果</h2><button id="import">加入本地媒体库</button></div><p>扫描仅建立影片索引，不移动网盘原文件。点击播放时才读取视频。</p><div id="videos"></div><video id="player" controls playsinline preload="none" class="hidden"></video></div></section><div class="footer"><button class="link" id="mounted">高级：使用已同步到电脑的网盘文件夹</button><p>账号未授权前不会扫描。登录和访问速度受网盘服务及会员规则影响。</p></div><script>
'use strict';
const params=new URLSearchParams(location.hash.slice(1));let cap=params.get('cap')||'';history.replaceState(null,'',location.pathname);let connecting=false;let providers=[],selected='baidu',path='/baidu',exportFolder='',timer=null;
const el=id=>document.getElementById(id);const show=(id,on)=>el(id).classList.toggle('hidden',!on);const report=msg=>{el('error').textContent=msg;show('error',!!msg)};
async function api(endpoint,data){const res=await fetch(endpoint,{method:data?'POST':'GET',headers:{'X-VVS-Capability':cap,'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});const result=await res.json();if(!res.ok)throw Error(result.error||'操作未完成');return result}
function native(message){if(window.webkit?.messageHandlers?.cloudAction)window.webkit.messageHandlers.cloudAction.postMessage(message);else report('请在 vvs-club Mac 应用中进行授权。')}
async function update(){try{const state=await api('/api/status');providers=state.providers;drawProviders();drawConnection();report('')}catch(e){report(e.message)}}
function drawProviders(){el('providers').replaceChildren();for(const p of providers){const b=document.createElement('button');b.className=p.id===selected?'selected':'';b.textContent=p.name;const s=document.createElement('small');s.textContent=p.connected?'已连接':p.available?'未连接':'暂未接通';b.append(s);b.onclick=()=>select(p.id);el('providers').append(b)}}
function drawConnection(){const p=providers.find(p=>p.id===selected);if(!p)return;el('name').textContent=p.name;el('description').textContent=p.note;el('authorize').disabled=!p.available||connecting;show('clear',!!p.configured&&!p.connected);el('status').textContent=connecting?'正在验证云端文件列表…':p.connected?'已连接 · 已验证文件列表':'尚未连接';show('login',!p.connected);show('browser',p.connected);const job=p.job;el('progress').textContent=job?.running?`正在扫描：已读 ${job.folders} 个目录，发现 ${job.videos} 部影片。`:job?.error||'';if(job&&!job.running&&p.scan)loadVideos().catch(e=>report(e.message))}
async function select(id){selected=id;path='/'+id;report('');show('results',false);el('player').pause();el('player').removeAttribute('src');show('player',false);await update();const p=providers.find(p=>p.id===selected);if(p?.connected){await list(path);await loadVideos()}}
async function list(next){try{const data=await api('/api/list?provider='+encodeURIComponent(selected)+'&path='+encodeURIComponent(next));path=data.path;el('breadcrumb').textContent=path;el('files').replaceChildren();el('up').disabled=path==='/'+selected;for(const item of data.items){const row=document.createElement('div');row.className='row';const name=document.createElement('span');name.textContent=(item.directory?'▱　':'▷　')+item.name;row.append(name);if(item.directory){const b=document.createElement('button');b.textContent='打开';const target=path+'/'+item.name;b.onclick=()=>list(target);row.append(b)}el('files').append(row)}if(!data.items.length)el('files').textContent='这个目录是空的。'}catch(e){report(e.message)}}
async function loadVideos(){const result=await api('/api/videos?provider='+encodeURIComponent(selected));exportFolder=result.folder||'';show('results',!!exportFolder);el('result-title').textContent=`发现 ${result.items.length} 部影片`;el('videos').replaceChildren();for(const item of result.items){const row=document.createElement('div');row.className='row';const name=document.createElement('span');name.textContent=item.name;const b=document.createElement('button');b.textContent='播放';b.onclick=()=>{show('player',true);el('player').src=item.play;el('player').play().catch(()=>report('当前视频未能播放，可检查网盘权限、会员或播放器支持。'))};row.append(name,b);el('videos').append(row)}el('import').disabled=!result.items.length}
el('authorize').onclick=()=>{report('');native({action:'login',provider:selected})};
el('rescan').onclick=async()=>{try{report('');await api('/api/scan',{provider:selected,path});await update()}catch(e){report(e.message)}};
el('clear').onclick=async()=>{if(!confirm('清除本机旧连接后重新登录？不会删除网盘文件。'))return;try{await api('/api/disconnect',{provider:selected});await update()}catch(e){report(e.message)}};
el('disconnect').onclick=async()=>{if(!confirm('断开本机网盘连接？不会删除网盘文件。平台授权仍可在网盘的设备管理中撤销。'))return;try{await api('/api/disconnect',{provider:selected});show('results',false);el('player').pause();el('player').removeAttribute('src');show('player',false);await update()}catch(e){report(e.message)}};
el('up').onclick=()=>list(path.slice(0,path.lastIndexOf('/'))||'/'+selected);el('refresh').onclick=()=>list(path);
el('import').onclick=()=>{if(exportFolder)native({action:'import',provider:selected,path:exportFolder})};el('mounted').onclick=()=>native({action:'mounted'});
window.cloudConnecting=provider=>{connecting=true;el('status').textContent='正在验证云端文件列表…';el('authorize').disabled=true};window.cloudConnected=async(provider)=>{connecting=false;await select(provider)};window.cloudFailure=async message=>{connecting=false;await update();report(message)};window.setClubTheme=dark=>document.documentElement.classList.toggle('dark',dark);
update();timer=setInterval(()=>{const p=providers.find(p=>p.id===selected);if(p?.job?.running)update()},1500);window.addEventListener('pagehide',()=>clearInterval(timer));
</script></body></html>
